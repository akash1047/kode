[workspace]
resolver = "2"

members = [
    "crates/acquisition",
    "crates/graph",
    "crates/storage",
    "crates/analysis",
    "crates/query",
    "crates/common",
    "services/app",
    "tools/cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }

[workspace.lints]
rust.unsafe_code = "deny"
rust.unused_crate_dependencies = "warn"
clippy.all = { level = "warn", priority = -1 }
clippy.cargo_common_metadata = "allow"
clippy.missing_docs_in_private_items = "allow"
clippy.doc_markdown = "allow"
