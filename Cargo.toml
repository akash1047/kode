[workspace]
resolver = "2"

members = [
    "crates/acquisition",
    "crates/graph",
    "crates/storage",
    "crates/analysis",
    "crates/query",
    "crates/common",
    "services/app",
    "tools/cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ignore = "0.4"
tempfile = "3"

[workspace.lints]
rust.unsafe_code = "deny"
rust.unused_crate_dependencies = "warn"
clippy.all = { level = "warn", priority = -1 }
clippy.cargo_common_metadata = "allow"
clippy.missing_docs_in_private_items = "allow"
clippy.doc_markdown = "allow"
