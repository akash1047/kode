[package]
name = "kode-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kode"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
clap = { workspace = true }
kode-acquisition = { path = "../../crates/acquisition" }
kode-app = { path = "../../services/app" }
kode-graph = { path = "../../crates/graph" }
kode-query = { path = "../../crates/query" }
kode-storage = { path = "../../crates/storage" }
kode-agent = { path = "../../crates/agent" }
rmcp = { version = "2", features = ["server", "transport-io", "transport-streamable-http-server", "schemars"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
thiserror = { workspace = true }
toml = { workspace = true }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7"
unicode-width = "0.2"
futures-util = { workspace = true }
serde.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

