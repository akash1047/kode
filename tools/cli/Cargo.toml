[package]
name = "kode-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kode"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
clap = { workspace = true }
kode-acquisition = { path = "../../crates/acquisition" }
kode-app = { path = "../../services/app" }
kode-graph = { path = "../../crates/graph" }
kode-query = { path = "../../crates/query" }
kode-storage = { path = "../../crates/storage" }
rmcp = { version = "2", features = ["server", "transport-io", "transport-streamable-http-server", "schemars"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
thiserror = { workspace = true }
toml = { workspace = true }
ratatui = { version = "0.30", features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"
reqwest = { workspace = true }
futures-util = { workspace = true }
serde.workspace = true
rig = "0.39.0"
pulldown-cmark = "0.12"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

