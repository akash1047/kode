[package]
name = "kode-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kode"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
kode-acquisition = { path = "../../crates/acquisition" }
kode-app = { path = "../../services/app" }
kode-graph = { path = "../../crates/graph" }
kode-query = { path = "../../crates/query" }
kode-storage = { path = "../../crates/storage" }
rmcp = { version = "2", features = ["server", "transport-io", "transport-streamable-http-server", "schemars"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
thiserror = { workspace = true }
toml = { workspace = true }

